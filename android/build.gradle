// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            // Configure Kotlin JVM target without referencing the KotlinCompile
            // class from the root buildscript classloader (the root project does
            // not pull in the Kotlin Gradle plugin classpath — only individual
            // Capacitor plugin subprojects do). Match tasks by name instead so
            // this stays safe whether or not Kotlin is on the classpath.
            project.plugins.withId('org.jetbrains.kotlin.android') {
                project.tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Kotlin') }.configureEach { task ->
                    if (task.hasProperty('kotlinOptions')) {
                        task.kotlinOptions.jvmTarget = '17'
                    }
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
