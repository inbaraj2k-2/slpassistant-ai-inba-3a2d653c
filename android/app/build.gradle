apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def resolveSigningProp = { String propKey, String envKey ->
    def envVal = System.getenv(envKey)
    if (envVal != null && !envVal.trim().isEmpty()) return envVal.trim()
    def propVal = keystoreProperties.getProperty(propKey)
    return propVal == null ? null : propVal.trim()
}

def signingStoreFile = resolveSigningProp('storeFile', 'ANDROID_KEYSTORE_FILE')
def signingStorePassword = resolveSigningProp('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def signingKeyAlias = resolveSigningProp('keyAlias', 'ANDROID_KEY_ALIAS')
def signingKeyPassword = resolveSigningProp('keyPassword', 'ANDROID_KEY_PASSWORD')

def resolvedStoreFile = null
if (signingStoreFile != null && !signingStoreFile.isEmpty()) {
    def appRelativeFile = file(signingStoreFile)
    def rootRelativeFile = rootProject.file(signingStoreFile)
    def repoRootRelativeFile = rootProject.projectDir.parentFile == null ? null : new File(rootProject.projectDir.parentFile, signingStoreFile)

    if (appRelativeFile.exists()) {
        resolvedStoreFile = appRelativeFile
    } else if (rootRelativeFile.exists()) {
        resolvedStoreFile = rootRelativeFile
    } else if (repoRootRelativeFile != null && repoRootRelativeFile.exists()) {
        resolvedStoreFile = repoRootRelativeFile
    }
}

def hasReleaseSigning = resolvedStoreFile != null &&
    signingStorePassword != null && !signingStorePassword.isEmpty() &&
    signingKeyAlias != null && !signingKeyAlias.isEmpty() &&
    signingKeyPassword != null && !signingKeyPassword.isEmpty()

def validateReleaseSigning = {
    def missing = []
    if (signingStoreFile == null || signingStoreFile.isEmpty()) missing << "storeFile / ANDROID_KEYSTORE_FILE"
    if (resolvedStoreFile == null) missing << "existing keystore file for '${signingStoreFile}'"
    if (signingStorePassword == null || signingStorePassword.isEmpty()) missing << "storePassword / ANDROID_KEYSTORE_PASSWORD"
    if (signingKeyAlias == null || signingKeyAlias.isEmpty()) missing << "keyAlias / ANDROID_KEY_ALIAS"
    if (signingKeyPassword == null || signingKeyPassword.isEmpty()) missing << "keyPassword / ANDROID_KEY_PASSWORD"

    if (!missing.isEmpty()) {
        throw new GradleException("Release signing is incomplete. Missing: ${missing.join(', ')}. Provide android/keystore.properties or ANDROID_KEYSTORE_* environment variables.")
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.hasTask(":app:bundleRelease") || taskGraph.hasTask(":app:signReleaseBundle") || taskGraph.hasTask(":app:assembleRelease")) {
        validateReleaseSigning()
    }
}

android {
    namespace = "app.lovable.slpassistant"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "app.lovable.slpassistant"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile resolvedStoreFile
            storePassword signingStorePassword
            keyAlias signingKeyAlias
            keyPassword signingKeyPassword
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
