apply plugin: 'com.android.application'

// Canonical release signing config: read ONLY android/key.properties.
def keyPropsFile = rootProject.file("key.properties")
def keyProps = new Properties()
if (keyPropsFile.exists()) {
    keyPropsFile.withInputStream { keyProps.load(it) }
}

def signingStoreFileName = (keyProps.getProperty('storeFile') ?: '').trim()
def signingStorePassword = (keyProps.getProperty('storePassword') ?: '').trim()
def signingKeyAlias      = (keyProps.getProperty('keyAlias') ?: '').trim()
def signingKeyPassword   = (keyProps.getProperty('keyPassword') ?: '').trim()

// Resolve keystore path (relative to android/) — fall back to app dir if needed.
def resolvedStoreFile = null
if (!signingStoreFileName.isEmpty()) {
    def candidates = [
        rootProject.file(signingStoreFileName),
        file(signingStoreFileName),
    ]
    resolvedStoreFile = candidates.find { it != null && it.exists() }
}

// Always provide a non-null placeholder so signingConfigs.release is well-formed.
// Real validation happens in the validateReleaseSigning task below.
def placeholderStore = rootProject.file("key.properties")
def effectiveStoreFile = resolvedStoreFile ?: placeholderStore

android {
    namespace = "app.lovable.slpassistant"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "app.lovable.slpassistant"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 19
        versionName "1.0.18"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile effectiveStoreFile
            storePassword signingStorePassword.isEmpty() ? "unset" : signingStorePassword
            keyAlias signingKeyAlias.isEmpty() ? "unset" : signingKeyAlias
            keyPassword signingKeyPassword.isEmpty() ? "unset" : signingKeyPassword
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

}

// Fail fast with a precise message BEFORE :app:signReleaseBundle runs,
// instead of surfacing a NullPointerException from the signing task.
tasks.register("validateReleaseSigning") {
    doLast {
        def problems = []
        if (!keyPropsFile.exists()) {
            problems << "android/key.properties is missing"
        }
        if (signingStoreFileName.isEmpty()) problems << "key.properties 'storeFile' is empty or missing"
        if (signingStorePassword.isEmpty()) problems << "key.properties 'storePassword' is empty or missing"
        if (signingKeyAlias.isEmpty())      problems << "key.properties 'keyAlias' is empty or missing"
        if (signingKeyPassword.isEmpty())   problems << "key.properties 'keyPassword' is empty or missing"
        if (resolvedStoreFile == null && !signingStoreFileName.isEmpty()) {
            problems << "keystore file '${signingStoreFileName}' not found under android/ or android/app/"
        }
        if (!problems.isEmpty()) {
            throw new GradleException(
                "Release signing is not configured correctly:\n  - " + problems.join("\n  - ")
            )
        }
        logger.lifecycle("Release signing OK: store=${resolvedStoreFile}, alias=${signingKeyAlias}")
    }
}

// Attach validation before every release signing / bundling task.
tasks.matching { it.name in ["bundleRelease", "assembleRelease", "signReleaseBundle", "packageRelease"] }.configureEach {
    dependsOn "validateReleaseSigning"
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
