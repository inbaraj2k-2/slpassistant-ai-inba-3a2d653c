name: Build Signed Android APK

# Dedicated APK pipeline. Kept intentionally SEPARATE from build-aab.yml so
# both run independently from the same commit and upload their own artifact.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build web app, sync Capacitor, and assemble Android release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Export JAVA_HOME for Gradle
        run: |
          echo "JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> "$GITHUB_ENV"
          echo "org.gradle.java.home=${{ steps.setup-java.outputs.path }}" >> android/gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: bun install

      - name: Build standalone Capacitor SPA bundle
        env:
          VITE_SENTRY_DSN: https://b91aa1be33208d35de72ef8a7995b597@o4511836157313024.ingest.us.sentry.io/4511836178284544
        run: bun run build:capacitor

      - name: Verify Capacitor web entrypoint
        run: test -f dist/capacitor/index.html

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Assemble Release APK
        working-directory: android
        # Uses the same signing source as the AAB workflow:
        # android/key.properties + the committed keystore.
        # validateReleaseSigning fails loudly if signing is unavailable.
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
