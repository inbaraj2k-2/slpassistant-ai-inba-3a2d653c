name: Build and Verify

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build web app, sync Capacitor, and assemble Android release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: bun install

      - name: Build web app and prepare Capacitor assets
        run: bun run build

      - name: Verify Capacitor web entrypoint
        run: test -f .output/public/index.html

      - name: Verify Capacitor configuration
        run: bunx cap config

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Prepare Keystore
        run: |
          mkdir -p android/app
          cp android/slpassistai-release.jks 
      android/app/slpassistai-release.jks

      - name: Bundle Android App Bundle (AAB)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
