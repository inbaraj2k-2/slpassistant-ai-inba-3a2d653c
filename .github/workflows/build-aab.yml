name: Build Signed Android AAB

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build web app, sync Capacitor, and assemble Android release
    runs-on: ubuntu-latest

    steps:
      - name: Sanity check (proves the job started)
        run: |
          echo "Workflow started on ref=${GITHUB_REF} sha=${GITHUB_SHA}"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Event: ${GITHUB_EVENT_NAME}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Export JAVA_HOME for Gradle
        run: |
          echo "JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> "$GITHUB_ENV"
          echo "org.gradle.java.home=${{ steps.setup-java.outputs.path }}" >> android/gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: bun install

      - name: Build standalone Capacitor SPA bundle
        run: bun run build:capacitor

      - name: Verify Capacitor web entrypoint
        run: test -f dist/capacitor/index.html

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Decode keystore (if provided)
        id: decode-keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/slpassistai-release.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded to android/app/slpassistai-release.jks"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret; will build UNSIGNED AAB for debugging."
          fi

      - name: Write key.properties (if signing secrets present)
        if: steps.decode-keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=slpassistai-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "Wrote android/key.properties"

      - name: Remove signing config if no keystore (unsigned debug build)
        if: steps.decode-keystore.outputs.has_keystore != 'true'
        run: |
          rm -f android/key.properties
          echo "Building unsigned AAB. Add ANDROID_KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD repo secrets to produce a signed release."

      - name: Bundle Android App Bundle (AAB) — signed
        if: steps.decode-keystore.outputs.has_keystore == 'true'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Bundle Android App Bundle (AAB) — unsigned debug fallback
        if: steps.decode-keystore.outputs.has_keystore != 'true'
        working-directory: android
        run: ./gradlew bundleDebug --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
