name: Build Signed Android AAB

# Single-source-of-truth release pipeline: only main can build.
# Every build explicitly checks out main so the bundle cannot come from a
# feature/diagnostic/stale branch.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build web app, sync Capacitor, and bundle Android release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Export JAVA_HOME for Gradle
        run: |
          echo "JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> "$GITHUB_ENV"
          echo "org.gradle.java.home=${{ steps.setup-java.outputs.path }}" >> android/gradle.properties

      - name: Verify Java and Gradle
        working-directory: android
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          "$JAVA_HOME/bin/java" -version
          ./gradlew --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: bun install

      - name: Build standalone Capacitor SPA bundle
        env:
          VITE_SENTRY_DSN: https://b91aa1be33208d35de72ef8a7995b597@o4511836157313024.ingest.us.sentry.io/4511836178284544
        run: bun run build:capacitor

      - name: Verify Capacitor web entrypoint
        run: test -f dist/capacitor/index.html

      - name: Verify Capacitor configuration
        run: bunx cap config

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Bundle signed release AAB
        working-directory: android
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload signed release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
